{% extends 'base.html' %}

{% block title %}Password Updated | {{ store_settings.store_name }}{% endblock %}

{% block content %}
<div class="container py-5 my-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-8 scroll-reveal">
            <div class="glass-card spotlight-card text-center p-5">
                <i class="fas fa-check-circle text-success display-4 mb-4"></i>
                <h2 class="text-luxury-title mb-3">Password Changed</h2>
                <p class="small text-muted mb-4">Your password has been changed successfully. You can now log in using your new credentials.</p>
                <hr class="border-secondary my-4">
                <a href="{% url 'accounts:login' %}" class="btn btn-neon w-100 py-3" style="border-radius: 6px;">Sign In Now</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
